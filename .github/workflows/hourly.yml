name: hourly-forecast
on:
  schedule: [{cron: '7 * * * *'}]   # hourly (GitHub may delay scheduled runs by minutes)
  workflow_dispatch: {}
  push: {branches: [main], paths: ['site/**','engine/**','data/**','model/**']}
# Job tokens stay minimal. Actions are pinned to commit SHAs (Node 24 majors).
# Do not print secrets. GitHub masks secret values; debug logging is still unnecessary here.
permissions: {}
concurrency: {group: hourly, cancel-in-progress: false}
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - run: python -m pip install --require-hashes -r requirements.txt
      - name: Forecast + alerts + push
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_SUB: ${{ vars.VAPID_SUB }}
          SUBSCRIBE_URL: ${{ vars.SUBSCRIBE_URL }}
          SUBSCRIPTIONS_URL: ${{ secrets.SUBSCRIPTIONS_URL }}
          SUBSCRIPTIONS_TOKEN: ${{ secrets.SUBSCRIPTIONS_TOKEN }}
          FORECAST_MODEL: icon_seamless
          USE_IMS_RADAR: '0'
        run: python engine/run_job.py
      - name: Persist push de-dup state
        run: |
          git config user.name flood-bot
          git config user.email flood-bot@users.noreply.github.com
          git add -f state/push_sent.json 2>/dev/null || true
          files=$(git diff --cached --name-only)
          if [ -z "$files" ]; then
            exit 0
          fi
          if [ "$files" != "state/push_sent.json" ]; then
            echo "refusing to commit unexpected files"
            git reset
            exit 0
          fi
          git commit -m "push state [skip ci]"
          git push || echo "state commit was not pushed; continuing so the site can still deploy"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with: {path: site, include-hidden-files: 'true'}
  deploy:
    needs: forecast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {pages: write, id-token: write}
    environment: {name: github-pages, url: '${{ steps.deploy.outputs.page_url }}'}
    steps:
      # Pages source must be GitHub Actions in repo settings. The Actions token cannot create the site.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
