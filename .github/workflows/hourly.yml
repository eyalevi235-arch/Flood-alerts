name: hourly-forecast
on:
  schedule: [{cron: '7 * * * *'}, {cron: '37 * * * *'}]   # hourly; second slot if GitHub skips one
  workflow_dispatch: {}
  push: {branches: [main], paths: ['site/**','engine/**','data/**','model/**','!**.md','!docs/**']}  # negations = paths-ignore (GitHub forbids paths + paths-ignore together)
# Job tokens stay minimal. Actions are pinned to commit SHAs (Node 24 majors).
# Do not print secrets. GitHub masks secret values; debug logging is still unnecessary here.
permissions: {}
concurrency: {group: hourly, cancel-in-progress: false}
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: write}
    env:
      # radar-live switch (repo variable). Unset/off = today's behaviour. shadow = validate + log only. on = the site reads
      # radar_live/latest.json from the radar-live branch in the browser and falls back to this forecast with a banner.
      RADAR_LIVE_MODE: ${{ vars.RADAR_LIVE_MODE || 'off' }}
    outputs:
      publish: ${{ steps.forecast.outputs.publish }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {ref: main}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12', cache: 'pip', cache-dependency-path: requirements.txt}
      - name: Restore Open-Meteo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .om_cache
          key: om-openmeteo-main-${{ github.run_id }}
          restore-keys: |
            om-openmeteo-main-
      - name: Fail-fast strict JSON/GeoJSON check (before model)
        run: python tools/check_json_strict.py site/data
      - run: python -m pip install --require-hashes -r requirements.txt
      - name: Fetch radar-live (git only; no Open-Meteo calls)
        if: env.RADAR_LIVE_MODE == 'shadow' || env.RADAR_LIVE_MODE == 'on'
        continue-on-error: true
        run: |
          mkdir -p .radar_live
          rm -f .radar_live/latest.json
          if git fetch --no-tags --depth 1 origin refs/heads/radar-live; then
            git show FETCH_HEAD:radar_live/latest.json > .radar_live/latest.json || rm -f .radar_live/latest.json
          fi
      - name: Forecast + alerts + push
        id: forecast
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_SUB: ${{ vars.VAPID_SUB }}
          SUBSCRIBE_URL: ${{ vars.SUBSCRIBE_URL }}
          SUBSCRIPTIONS_URL: ${{ secrets.SUBSCRIPTIONS_URL }}
          SUBSCRIPTIONS_TOKEN: ${{ secrets.SUBSCRIPTIONS_TOKEN }}
          FORECAST_MODEL: icon_seamless
          USE_IMS_RADAR: '0'
          OM_CACHE_DIR: ${{ github.workspace }}/.om_cache
          OM_CACHE_FRESH_H: '1.5'
          OM_CACHE_STALE_H: '6'
          OM_HISTORY_H: '24'
          OM_SHORT_PAST_DAYS: '2'
          OM_RETRY_BUDGET_S: '480'
          RADAR_LIVE_FILE: ${{ github.workspace }}/.radar_live/latest.json
          RADAR_LIVE_MAX_ISSUE_AGE_MIN: '40'
          RADAR_LIVE_MAX_FRAME_AGE_MIN: '60'
        run: python engine/run_job.py
      - name: Public data guard (no rain/mm keys, no internal radar rain grid)
        if: steps.forecast.outputs.publish == 'true'
        run: python tools/check_public_no_rain.py site/data .
      - name: Persist push de-dup state
        if: steps.forecast.outputs.publish == 'true'
        run: |
          git config user.name flood-bot
          git config user.email flood-bot@users.noreply.github.com
          git add -f state/push_sent.json 2>/dev/null || true
          files=$(git diff --cached --name-only)
          if [ -z "$files" ]; then
            exit 0
          fi
          if [ "$files" != "state/push_sent.json" ]; then
            echo "refusing to commit unexpected files"
            git reset
            exit 0
          fi
          git commit -m "push state [skip ci]"
          # Rebase onto latest main before push. During a rebase, "ours" is
          # upstream and "theirs" is this commit, so --strategy-option=theirs
          # keeps this run's freshly generated state/push_sent.json on conflict.
          for i in 1 2 3 4 5; do
            if git pull --rebase --strategy-option=theirs origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "persist failed (attempt $i/5); retrying..."
            git rebase --abort 2>/dev/null || true
            sleep 8
          done
          echo "failed to persist push state after 5 attempts"
          exit 1
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: steps.forecast.outputs.publish == 'true'
        with: {path: site, include-hidden-files: 'true'}
  deploy:
    needs: forecast
    if: needs.forecast.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {pages: write, id-token: write}
    environment: {name: github-pages, url: '${{ steps.deploy.outputs.page_url }}'}
    steps:
      # Pages source must be GitHub Actions in repo settings. The Actions token cannot create the site.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
