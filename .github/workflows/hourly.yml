name: hourly-forecast
on:
  schedule: [{cron: '7 * * * *'}]   # hourly (GitHub may delay scheduled runs by minutes)
  workflow_dispatch: {}
  push: {branches: [main], paths: ['site/**','engine/**','data/**','model/**']}
# Node 20 actions no longer run on GitHub-hosted runners (removed 2026-09-23).
# These majors are the Node 24 releases.
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: hourly, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: {name: github-pages, url: '${{ steps.deploy.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Forecast + alerts + push
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_SUB: ${{ vars.VAPID_SUB }}
          SUBSCRIBE_URL: ${{ vars.SUBSCRIBE_URL }}
          SUBSCRIPTIONS_URL: ${{ secrets.SUBSCRIPTIONS_URL }}
          SUBSCRIPTIONS_TOKEN: ${{ secrets.SUBSCRIPTIONS_TOKEN }}
          FORECAST_MODEL: icon_seamless
          USE_IMS_RADAR: '0'
        run: python engine/run_job.py
      - name: Persist push de-dup state
        run: |
          git config user.name flood-bot
          git config user.email flood-bot@users.noreply.github.com
          git add -f state/push_sent.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "push state [skip ci]"
            git push || echo "state commit was not pushed; continuing so the site can still deploy"
          fi
      # Pages source must be GitHub Actions in repo settings. The Actions token cannot create the site.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: {path: site, include-hidden-files: 'true'}
      - id: deploy
        uses: actions/deploy-pages@v5
